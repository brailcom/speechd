# Fono generic output module for Speech Dispatcher.
# It uses the fono command-line client to synthesize speech.
# Use this config file with the sd_generic output module.
#
# Fono (https://fono.page) is a voice stack that speaks through whichever
# backend is set in ~/.config/fono/config.toml. That can be on-device ONNX
# synthesis (Kokoro, Piper or Supertonic), a Wyoming server on the LAN, an
# OpenAI-compatible endpoint, or a cloud vendor such as ElevenLabs or
# Cartesia. The choice is invisible here: the command below stays the same.

# Debug turns debugging on or off
# See speechd.conf for information where debugging information is stored
Debug 0

GenericDefaultCharset "utf-8"

# `fono speak stream` reads text on stdin and plays the audio itself, so no
# $PLAY_COMMAND is needed. It exits on SIGKILL and stops playback with it,
# which is what the generic module needs for stop and cancel.
GenericExecuteSynth \
"printf %s \'$DATA\' | fono speak stream --voice \'$VOICE\'"

GenericCmdDependency "fono"
GenericSoundIconFolder "/usr/share/sounds/sound-icons/"

# Fono selects the voice for each utterance's language on its own, so no
# per-language voice strings are needed.
GenericLanguage "en" "en" "utf-8"

# Voices are addressed by palette label rather than by raw model id, which
# keeps this file backend independent. Run `fono voices list` to see the
# labels your backend offers; a label with no voice behind it falls back to
# the configured default.
AddVoice "en" "MALE1"   "male 1"
AddVoice "en" "MALE2"   "male 2"
AddVoice "en" "FEMALE1" "female 1"
AddVoice "en" "FEMALE2" "female 2"
AddVoice "en" "FEMALE3" "female 3"
AddVoice "en" "CHILD_FEMALE" "female 4"

# "auto" lets fono pick a voice for the language of the text.
DefaultVoice "auto"

